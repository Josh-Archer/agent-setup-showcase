name: model-matrix-check

on:
  pull_request:
    paths:
      - "models/**"
      - "scripts/promote_model_matrix.py"
      - "scripts/sync_agent_surfaces.py"
      - "scripts/tests/**"
      - ".codex/agents/**"
      - ".claude/agents/**"
      - ".gemini/agents/**"
      - ".grok/**"
      - ".agents/plugins/home-codex-agents/**"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Promote/check model matrix
        run: python scripts/promote_model_matrix.py --check

      - name: Sync surface drift check
        run: python scripts/sync_agent_surfaces.py --check

      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v
